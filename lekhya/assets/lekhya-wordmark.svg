<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&amp;family=Noto+Sans+Devanagari:wght@500&amp;display=swap');
    </style>
    <radialGradient id="icon-bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#2D6B4A"/>
      <stop offset="100%" stop-color="#1E4D35"/>
    </radialGradient>
  </defs>

  <!-- ── Mini icon ── -->
  <rect x="10" y="10" width="90" height="90" rx="18" ry="18" fill="url(#icon-bg)"/>
  <!-- Inner gold border -->
  <rect x="13" y="13" width="84" height="84" rx="15" ry="15"
        fill="none" stroke="#E8A838" stroke-width="1.5" opacity="0.5"/>
  <!-- ले glyph -->
  <text
    x="55"
    y="79"
    font-family="'Noto Sans Devanagari', 'Mukta', sans-serif"
    font-size="58"
    font-weight="600"
    fill="#E8A838"
    text-anchor="middle"
  >ले</text>
  <!-- Ruled line inside mini icon -->
  <rect x="19" y="84" width="72" height="3" rx="1.5" fill="#E8A838" opacity="0.55"/>

  <!-- ── Wordmark text column ── -->

  <!-- "lekhya" — Plus Jakarta Sans SemiBold, Forest Green -->
  <text
    x="119"
    y="55"
    font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="34"
    font-weight="600"
    fill="#1E4D35"
    letter-spacing="0.6"
  >lekhya</text>

  <!-- Thin Turmeric Gold accent bar under the Latin wordmark -->
  <rect x="119" y="62" width="178" height="2.5" rx="1.25" fill="#E8A838" opacity="0.7"/>

  <!-- "लेख्य" — Noto Sans Devanagari Medium, Forest Green at 68% -->
  <text
    x="121"
    y="88"
    font-family="'Noto Sans Devanagari', 'Mukta', sans-serif"
    font-size="19"
    font-weight="500"
    fill="#1E4D35"
    opacity="0.68"
  >लेख्य</text>
</svg>
